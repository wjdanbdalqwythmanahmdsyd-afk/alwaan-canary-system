<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#8d1024">
<title>ألوان الكناري | نظام إدارة المصنع</title>
<style>
:root{--wine:#8d1024;--red:#b51f35;--gold:#e9b83e;--bg:#f7f5f2;--card:#fff;--text:#302a2d;--muted:#777;--border:#e9e1df}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#fff,#fff5ed,#f4e5e7)}
.login-card{width:min(440px,100%);text-align:center;padding:28px;border-radius:24px;background:#ffffffed;box-shadow:0 15px 45px #57132118;border:1px solid var(--border)}
.logo{width:125px;height:125px;object-fit:contain}.login h1{color:var(--wine)}.login p{color:var(--muted);line-height:1.9}
.field{margin:14px 0;text-align:right}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #ddd2d0;border-radius:10px;background:white}
.primary{border:0;background:var(--wine);color:white;border-radius:10px;padding:12px 17px;font-weight:bold}.primary:hover{background:var(--red)}
.secondary{border:1px solid #ead9a8;background:#fff7df;color:#73520c;border-radius:10px;padding:10px 13px}
.topbar{background:white;border-bottom:1px solid var(--border);padding:10px 20px;min-height:75px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:52px;height:52px;object-fit:contain}.brand strong{color:var(--wine)}.brand small{display:block;color:var(--muted);margin-top:5px}
.layout{display:grid;grid-template-columns:245px minmax(0,1fr)}
.sidebar{background:white;border-left:1px solid var(--border);padding:14px;min-height:calc(100vh - 75px)}
.nav-title{color:#aaa;font-size:12px;padding:12px 8px}
.navbtn{display:block;width:100%;text-align:right;padding:12px;margin:3px 0;border:0;border-radius:10px;background:transparent;color:#555}
.navbtn:hover,.navbtn.active{background:#f8e8eb;color:var(--wine);font-weight:bold}
.main{padding:24px;min-width:0;position:relative;isolation:isolate}
.main::before{content:"";position:fixed;z-index:-1;pointer-events:none;inset:90px 250px 0 0;background:url("logo.jpg") center center/min(55vw,550px) no-repeat;opacity:.075}
.page-head{margin-bottom:20px}.page-head h2{color:var(--wine);margin-top:0}.page-head p{color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{background:#ffffffed;border:1px solid var(--border);border-radius:15px;padding:18px;margin-bottom:16px;box-shadow:0 5px 20px #32101a08}
.stat-title{color:var(--muted);font-size:12px}.stat-number{color:var(--wine);font-size:25px;font-weight:bold;margin:12px 0}.section-title{color:var(--wine);margin-top:0}
.quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.quick{text-align:right;padding:16px;background:white;border:1px solid var(--border);border-radius:12px;color:var(--text)}
.quick b{display:block;color:var(--wine);margin:8px 0}.quick small{color:var(--muted);line-height:1.8}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.form-actions{display:flex;gap:8px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}th,td{text-align:right;padding:12px;border-bottom:1px solid var(--border);font-size:13px}
th{background:#f9eeee;color:var(--wine)}.table-wrap{overflow-x:auto}
.notice-layout{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.notice-preview{border:1px solid #efd6d9;background:linear-gradient(135deg,#fff9ed,#f8e8eb);padding:18px;border-radius:14px;min-height:180px;line-height:1.9}
.notice-preview img{max-width:100%;max-height:200px;object-fit:contain;border-radius:10px}
.notice-item{padding:10px;background:white;border:1px solid var(--border);border-radius:10px;margin-top:8px}
.toast{position:fixed;bottom:18px;left:18px;padding:12px 16px;border-radius:10px;background:#30262a;color:white;z-index:20;max-width:90%}
.footer-note{color:var(--muted);font-size:12px;line-height:1.9}
body.night{--bg:#211b20;--card:#30272e;--text:#f8edf1;--muted:#c4b5be;--border:#4b3c44}
.night .topbar,.night .sidebar,.night .card,.night .quick,.night .notice-item{background:#30272e;color:var(--text)}
.night .navbtn{color:#eee}.night .navbtn.active{background:#512a37;color:#ffdce2}
.night .main::before{opacity:.11}.night th{background:#49313b}.night td{color:var(--text)}
.night input,.night select,.night textarea{background:#3a3038;color:white;border-color:#594751}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{display:none}.sidebar.open{display:block;position:fixed;z-index:10;top:75px;right:0;bottom:0;width:260px;overflow:auto;box-shadow:0 0 30px #0002}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.notice-layout{grid-template-columns:1fr}.main{padding:15px}.main::before{inset:100px 10px 0;background-size:75vw}}
@media(max-width:520px){.brand small{display:none}.brand img{width:42px;height:42px}.form-grid,.quick-grid{grid-template-columns:1fr}.main{padding:12px}}
</style>
</head>
<body>

<section class="login" id="loginScreen">
<form class="login-card" id="loginForm">
<img class="logo" src="logo.jpg" alt="شعار ألوان الكناري">
<h1>ألوان الكناري</h1>
<p>نظام إدارة الإنتاج والجودة والخلطات<br>لصناعات الأغذية</p>
<div class="field"><label>المسمى الوظيفي</label>
<select id="job"><option value="">اختر المسمى الوظيفي</option>
<option>الإدارة العليا</option><option>مشرف قسم</option><option>مسؤول الجودة</option><option>مسؤول الإنتاج</option><option>فني صيانة</option><option>عامل</option></select></div>
<div class="field"><label>اسم المستخدم</label><input id="username" required autocomplete="username" placeholder="اسم المستخدم"></div>
<div class="field"><label>كلمة المرور</label><input id="password" type="password" required autocomplete="current-password" placeholder="كلمة المرور"></div>
<button class="primary" style="width:100%">دخول إلى النظام</button>

<div id="system" class="hidden">
<header class="topbar">
<div class="brand"><button class="secondary" id="menuBtn">☰</button><img src="logo.jpg" alt="الشعار">

<div><span id="welcome"></span> <button class="secondary" id="themeBtn">الوضع الليلي</button> <button class="secondary" id="logoutBtn">خروج</button></div>
</header>
<div class="layout">
<aside class="sidebar" id="sidebar">
<div class="nav-title">القائمة الرئيسية</div>
<button class="navbtn active" data-page="dashboard">🏠 لوحة التحكم</button>
<button class="navbtn" data-page="notices">🔔 الإشعارات والتنبيهات</button>
<button class="navbtn" data-page="quality">✓ الجودة</button>
<button class="navbtn" data-page="recipes">♨ الخلطات والوصفات</button>
<button class="navbtn" data-page="production">▤ سجل الإنتاج</button>
<button class="navbtn" data-page="machines">⚙ الماكينات</button>

<button class="navbtn" data-page="reports">📊 التقارير و OEE</button>
<div class="nav-title">الموارد البشرية والإدارة</div>
<button class="navbtn" data-page="employees">👤 الموظفون</button>
<button class="navbtn" data-page="leave">📅 الإجازات</button>
<button class="navbtn" data-page="penalties">⚑ الإنذارات والجزاءات</button>
<button class="navbtn" data-page="users">♙ المستخدمون والصلاحيات</button>
<button class="navbtn" data-page="settings">⚙ الإعدادات</button>
</aside>
<main class="main" id="content"></main>
</div>
</div>
<div class="toast hidden" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://vfuqrrnpmfxwherhlicl.supabase.co";
const SUPABASE_KEY="sb_publishable_01t_qcQujpZjuik6vwhyZw_4fvLKpH3";
const LOGIN_URL=SUPABASE_URL+"/functions/v1/login-with-username";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);
let currentPage="dashboard",notices=[],noticeIndex=0,darkManual=null,currentUser=null,currentProfile=null;

function notify(message){const t=$("#toast");t.textContent=message;t.classList.remove("hidden");setTimeout(()=>t.classList.add("hidden"),3500)}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function heading(title,sub="إدارة ومتابعة بيانات المصنع"){return `<div class="page-head"><h2>${title}</h2><p>${sub}</p></div>`}
function panel(title,body){return `<section class="card"><h3 class="section-title">${title}</h3>${body}</section>`}
function field(label,placeholder="",type="text",name=""){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" placeholder="${placeholder}"></div>`}
function selectField(label,options,name=""){return `<div class="field"><label>${label}</label><select name="${name}"><option value="">اختر</option>${options.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("")}</select></div>`}
function textField(label,name,placeholder=""){return `<div class="field"><label>${label}</label><textarea name="${name}" rows="3" placeholder="${placeholder}"></textarea></div>`}
function val(form,name){return form.elements.namedItem(name)?.value?.trim()||""}
function dateToday(){return new Date().toISOString().slice(0,10)}

async function login(username,password){
 const response=await fetch(LOGIN_URL,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY},body:JSON.stringify({username,password})});
 const result=await response.json();
 if(!response.ok||!result.session)throw new Error(result.error||"تعذر تسجيل الدخول");
 const {error}=await db.auth.setSession({access_token:result.session.access_token,refresh_token:result.session.refresh_token});
 if(error)throw error;
 return result.user;
}
async function loadProfile(user){
 const {data,error}=await db.from("staff_profiles").select("id,full_name,username,role,department,is_active,auth_user_id").eq("auth_user_id",user.id).single();
 if(error)throw new Error("تم تسجيل الدخول لكن تعذر قراءة ملف الموظف. تحقق من ربط حسابه بجدول الموظفين.");
 if(!data||!data.is_active)throw new Error("حساب الموظف غير مفعل");
 return data;
}
function roleName(role){return ({admin:"الإدارة العليا",supervisor:"مشرف قسم",worker:"عامل"})[role]||role}
async function logout(){await db.auth.signOut();currentUser=null;currentProfile=null;$("#system").classList.add("hidden");$("#loginScreen").classList.remove("hidden");$("#password").value=""}

function dashboard(){return heading("لوحة التحكم","ملخص الإنتاج والجودة والماكينات")+
`<div class="stats">
<div class="card"><div class="stat-title">إنتاج اليوم</div><div class="stat-number">—</div><small>بانتظار ربط سجل الإنتاج</small></div>
<div class="card"><div class="stat-title">نسبة الجودة</div><div class="stat-number">—%</div><small>بانتظار الفحوصات</small></div>
<div class="card"><div class="stat-title">الماكينات العاملة</div><div class="stat-number">—</div><small>بانتظار الربط</small></div>
<div class="card"><div class="stat-title">وقت التوقف</div><div class="stat-number">—</div><small>بانتظار البلاغات</small></div></div>`+
panel("الوصول السريع",`<div class="quick-grid">
<button class="quick" data-jump="quality">✓ <b>فحص الجودة</b><small>نتائج الفحص والملاحظات</small></button>
<button class="quick" data-jump="recipes">♨ <b>الخلطات والوصفات</b><small>المكونات والكميات والاعتماد</small></button>
<button class="quick" data-jump="production">▤ <b>سجل الإنتاج</b><small>الوردية والإنتاج والهالك</small></button>
<button class="quick" data-jump="downtime">⏱ <b>بلاغ توقف</b><small>العطل والوقت والمشغل</small></button>
<button class="quick" data-jump="maintenance">🔧 <b>الصيانة</b><small>الطلبات والإجراءات</small></button>
<button class="quick" data-jump="reports">📊 <b>تقارير OEE</b><small>الإتاحة والأداء والجودة</small></button></div>`)+
panel("ملاحظة",`<p class="footer-note">الأقسام التي لم يتم ربطها بعد ستبقى للمعاينة. لا تعتمد أرقامًا غير محفوظة في قاعدة البيانات.</p>`)}

function formPage(title,fields,buttonText="حفظ البيانات"){return heading(title)+panel("إدخال بيانات جديدة",`<form class="demoForm"><div class="form-grid">${fields.join("")}</div><div class="form-actions"><button class="primary">${buttonText}</button><button type="reset" class="secondary">مسح الحقول</button></div></form>`)+panel("السجلات",`<p class="footer-note">هذا القسم لم يتم ربطه بقاعدة البيانات بعد.</p>`)}
function recipePage(){return heading("الخلطات والوصفات","إضافة وصفة ومكوناتها وحفظها في قاعدة البيانات")+
panel("إدخال وصفة جديدة",`<form id="recipeForm">
<div class="form-grid">
${field("اسم الوصفة","اسم الخلطة","text","recipe_name")}
${field("رمز الوصفة","REC-001","text","recipe_code")}
${field("رقم الإصدار","1","text","version")}
${field("حجم الدفعة بالكيلو","100","number","batch_size")}
${selectField("حالة الوصفة",["مسودة","بانتظار الاعتماد","معتمدة","موقوفة"],"status")}
${textField("تعليمات التحضير","description","ملاحظات التحضير")}
</div>
<h3 class="section-title">مكونات الوصفة</h3>
<div id="ingredients">
<div class="form-grid ingredient-row">
${field("اسم المادة","اسم المادة","text","ingredient_name")}
${field("الكمية","مثال: 25","number","quantity")}
${selectField("وحدة القياس",["كجم","جرام","لتر","مل","قطعة"],"unit")}
${field("ملاحظات","ملاحظات","text","ingredient_notes")}
</div></div>
<div class="form-actions"><button type="button" class="secondary" id="addIngredient">+ إضافة مكوّن</button>
<button class="primary">حفظ الوصفة ومكوناتها</button></div>
</form>`)+
panel("الوصفات المسجلة",`<div class="table-wrap"><table><thead><tr><th>الرمز</th><th>اسم الوصفة</th><th>الإصدار</th><th>تاريخ الإضافة</th></tr></thead><tbody id="recipesRows"><tr><td colspan="4">جارٍ تحميل البيانات...</td></tr></tbody></table></div>`)}

function qualityPage(){return heading("الجودة","تسجيل الفحوصات وربطها بالوصفات")+
panel("إضافة فحص جودة",`<form id="qualityForm"><div class="form-grid">
${field("تاريخ الفحص","","date","check_date")}
${field("اسم المنتج","اسم المنتج","text","product_name")}
${field("رقم التشغيلة","رقم التشغيلة","text","batch_number")}
${selectField("الوصفة المرتبطة",[],"recipe_id")}
${field("مسؤول الجودة","اسم الموظف","text","inspector_name")}
${selectField("نوع الفحص",["مواد خام","أثناء الإنتاج","منتج نهائي","تعبئة وتغليف"],"check_type")}
${selectField("نتيجة الفحص",["مطابق","غير مطابق","قيد الفحص"],"result")}
${textField("الملاحظات","notes","الملاحظات")}
${textField("الإجراء التصحيحي","corrective_action","الإجراء المتخذ عند الحاجة")}
</div><button class="primary">حفظ فحص الجودة</button></form>`)+
panel("سجل فحوصات الجودة",`<div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>المنتج</th><th>التشغيلة</th><th>النتيجة</th><th>المفتش</th></tr></thead><tbody id="qualityRows"><tr><td colspan="5">جارٍ تحميل البيانات...</td></tr></tbody></table></div>`)}

function noticesPage(){return heading("الإشعارات والتنبيهات","إنشاء إشعارات بالصور وتحديد الجمهور المستهدف")+
`<div class="notice-layout"><section class="card"><h3 class="section-title">إنشاء إشعار</h3><form id="noticeForm">
<div class="field"><label>عنوان الإشعار</label><input id="noticeTitle" required></div>
<div class="field"><label>نص الإشعار</label><textarea id="noticeText" rows="4" required></textarea></div>
<div class="field"><label>إرفاق صور</label><input id="noticeImages" type="file" accept="image/*" multiple></div>
<div class="field"><label>الجمهور المستهدف</label><select id="audience"><option>جميع الموظفين</option><option>الإدارة العليا</option><option>مشرفو الأقسام</option><option>قسم الجودة</option><option>قسم الإنتاج</option><option>الصيانة</option></select></div>
<button class="primary">إضافة الإشعار</button></form><p class="footer-note">الإشعارات معاينة محلية وليست منشورة للموظفين.</p></section>
<section class="card"><h3 class="section-title">معاينة الإشعارات</h3><div class="notice-preview" id="noticePreview">لا توجد إشعارات بعد.</div>
<p><button class="secondary" id="prevNotice">السابق</button> <button class="secondary" id="nextNotice">التالي</button> <button class="secondary" id="deleteNotice">حذف</button></p><div id="noticeList"></div></section></div>`}
function renderNotices(){const n=notices[noticeIndex];$("#noticePreview").innerHTML=n?`<b>${esc(n.title)}</b><p>${esc(n.text)}</p><small>الجمهور: ${esc(n.audience)}</small>${n.images.map(s=>`<img src="${s}" alt="صورة الإشعار">`).join("")}`:"لا توجد إشعارات بعد.";$("#noticeList").innerHTML=notices.map((x,i)=>`<div class="notice-item"><b>${esc(x.title)}</b> <button class="secondary" data-show="${i}">عرض</button></div>`).join("")}

function render(page){
currentPage=page;document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
let html="";
if(page==="dashboard")html=dashboard();
if(page==="notices")html=noticesPage();
if(page==="recipes")html=recipePage();
if(page==="quality")html=qualityPage();
if(page==="production")html=formPage("سجل الإنتاج",[field("اسم العامل","اسم المشغل"),selectField("الماكينة",["M-01","M-02","M-03"]),selectField("الوردية",["صباحية","مسائية","ليلية"]),field("تاريخ التشغيل","","date"),field("ساعات التشغيل","عدد الساعات","number"),field("كمية الإنتاج","الكمية","number"),field("كمية الهالك","الكمية","number"),field("الخلطة المستخدمة","اسم الوصفة")],"تسجيل الإنتاج");
if(page==="machines")html=formPage("الماكينات",[field("اسم الماكينة","اسم الماكينة"),field("رمز الماكينة","M-01"),selectField("القسم",["الإنتاج","التعبئة والتغليف","المخزن"]),selectField("حالة الماكينة",["تعمل","متوقفة","تحت الصيانة"]),field("المشغل المسؤول","اسم الموظف")],"إضافة ماكينة");

async function loadRecipes(){
const body=$("#recipesRows");if(!body)return;
const {data,error}=await db.from("recipes").select("id,recipe_name,recipe_code,version,created_at").order("created_at",{ascending:false});
if(error){body.innerHTML=`<tr><td colspan="4">تعذر تحميل الوصفات: ${esc(error.message)}</td></tr>`;return}
body.innerHTML=data.length?data.map(r=>`<tr><td>${esc(r.recipe_code||"—")}</td><td>${esc(r.recipe_name)}</td><td>${esc(r.version||"—")}</td><td>${esc(r.created_at?new Date(r.created_at).toLocaleDateString("ar"): "—")}</td></tr>`).join(""):`<tr><td colspan="4">لا توجد وصفات مسجلة.</td></tr>`;
}
async function loadRecipeOptions(){
const select=document.querySelector('[name="recipe_id"]');if(!select)return;
const {data,error}=await db.from("recipes").select("id,recipe_name,recipe_code").eq("is_active",true).order("recipe_name");
if(error){select.innerHTML='<option value="">تعذر تحميل الوصفات</option>';return}
select.innerHTML='<option value="">اختر الوصفة</option>'+data.map(r=>`<option value="${r.id}">${esc(r.recipe_name)} (${esc(r.recipe_code||"بدون رمز")})</option>`).join("");
}
async function loadQuality(){
const body=$("#qualityRows");if(!body)return;
const {data,error}=await db.from("quality_checks").select("check_date,product_name,batch_number,result,inspector_name").order("created_at",{ascending:false}).limit(100);
if(error){body.innerHTML=`<tr><td colspan="5">تعذر تحميل الفحوصات: ${esc(error.message)}</td></tr>`;return}
body.innerHTML=data.length?data.map(r=>`<tr><td>${esc(r.check_date||"—")}</td><td>${esc(r.product_name||"—")}</td><td>${esc(r.batch_number||"—")}</td><td>${esc(r.result||"—")}</td><td>${esc(r.inspector_name||"—")}</td></tr>`).join(""):`<tr><td colspan="5">لا توجد فحوصات مسجلة.</td></tr>`;
}

$("#loginForm").addEventListener("submit",async e=>{
e.preventDefault();const button=e.submitter;button.disabled=true;button.textContent="جارٍ التحقق...";
try{
const user=await login($("#username").value.trim(),$("#password").value);
currentUser=user;currentProfile=await loadProfile(user);
$("#welcome").textContent=(currentProfile.full_name||currentProfile.username)+" — "+roleName(currentProfile.role);
$("#loginScreen").classList.add("hidden");$("#system").classList.remove("hidden");render("dashboard");notify("تم تسجيل الدخول بنجاح");
}catch(err){notify(err.message||"تعذر تسجيل الدخول")}
finally{button.disabled=false;button.textContent="دخول إلى النظام"}
});

document.addEventListener("click",async e=>{
const nav=e.target.closest("[data-page]");if(nav){render(nav.dataset.page);$("#sidebar").classList.remove("open")}
const jump=e.target.closest("[data-jump]");if(jump)render(jump.dataset.jump);
if(e.target.id==="menuBtn")$("#sidebar").classList.toggle("open");
if(e.target.id==="logoutBtn")logout();
if(e.target.id==="themeBtn"||e.target.id==="settingsTheme"){darkManual=!document.body.classList.contains("night");document.body.classList.toggle("night",darkManual)}
if(e.target.id==="addIngredient"){
const row=document.createElement("div");row.className="form-grid ingredient-row";
row.innerHTML=field("اسم المادة","اسم المادة","text","ingredient_name")+field("الكمية","مثال: 25","number","quantity")+selectField("وحدة القياس",["كجم","جرام","لتر","مل","قطعة"],"unit")+field("ملاحظات","ملاحظات","text","ingredient_notes");
$("#ingredients").appendChild(row);
}
if(e.target.id==="prevNotice"&&notices.length){noticeIndex=(noticeIndex-1+notices.length)%notices.length;renderNotices()}
if(e.target.id==="nextNotice"&&notices.length){noticeIndex=(noticeIndex+1)%notices.length;renderNotices()}
if(e.target.id==="deleteNotice"&&notices.length){notices.splice(noticeIndex,1);noticeIndex=Math.max(0,Math.min(noticeIndex,notices.length-1));renderNotices()}
if(e.target.dataset.show!==undefined){noticeIndex=Number(e.target.dataset.show);renderNotices()}
});

document.addEventListener("submit",async e=>{
if(e.target.id==="recipeForm"){
e.preventDefault();const form=e.target;const btn=form.querySelector('button[type="submit"],button:not([type])');if(btn)btn.disabled=true;
try{
const recipe={recipe_name:val(form,"recipe_name"),recipe_code:val(form,"recipe_code")||null,version:val(form,"version")||"1",description:val(form,"description")||null,is_active:true};
if(!recipe.recipe_name)throw new Error("أدخل اسم الوصفة");
const {data:created,error}=await db.from("recipes").insert(recipe).select("id").single();
if(error)throw error;
const rows=[...form.querySelectorAll(".ingredient-row")];
const ingredients=[];
for(const row of rows){
const name=val(row,"ingredient_name"),quantity=val(row,"quantity"),unit=val(row,"unit"),notes=val(row,"ingredient_notes");
if(name&&quantity!==""&&unit)ingredients.push({recipe_id:created.id,ingredient_name:name,quantity:Number(quantity),unit,notes:notes||null});
}
if(ingredients.length){
const {error:ingredientError}=await db.from("recipe_ingredients").insert(ingredients);
if(ingredientError){notify("تم حفظ الوصفة لكن تعذر حفظ المكونات: "+ingredientError.message);await loadRecipes();return}
}
form.reset();notify("تم حفظ الوصفة ومكوناتها بنجاح");await loadRecipes();
}catch(err){notify("تعذر الحفظ: "+(err.message||"تحقق من صلاحيات قاعدة البيانات"))}
finally{if(btn)btn.disabled=false}
}
if(e.target.id==="qualityForm"){
e.preventDefault();const form=e.target;const btn=form.querySelector("button");btn.disabled=true;
try{
const record={check_date:val(form,"check_date")||dateToday(),product_name:val(form,"product_name"),batch_number:val(form,"batch_number")||null,recipe_id:val(form,"recipe_id")?Number(val(form,"recipe_id")):null,inspector_name:val(form,"inspector_name")||currentProfile?.full_name||null,check_type:val(form,"check_type"),result:val(form,"result"),notes:val(form,"notes")||null,corrective_action:val(form,"corrective_action")||null};
if(!record.product_name||!record.check_type||!record.result)throw new Error("أكمل اسم المنتج ونوع الفحص والنتيجة");
const {error}=await db.from("quality_checks").insert(record);if(error)throw error;
form.reset();notify("تم حفظ فحص الجودة بنجاح");await loadQuality();await loadRecipeOptions();
}catch(err){notify("تعذر حفظ الفحص: "+(err.message||"تحقق من صلاحيات قاعدة البيانات"))}
finally{btn.disabled=false}
}
if(e.target.id==="noticeForm"){
e.preventDefault();const files=[...$("#noticeImages").files];const images=await Promise.all(files.map(file=>new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(file)})));
notices.push({title:$("#noticeTitle").value,text:$("#noticeText").value,audience:$("#audience").value,images});noticeIndex=notices.length-1;renderNotices();e.target.reset();notify("تمت إضافة الإشعار للمعاينة");
}
if(e.target.classList.contains("demoForm")){e.preventDefault();notify("هذا القسم لم يتم ربطه بقاعدة البيانات بعد")}
});

function automaticTheme(){if(darkManual===null){const h=new Date().getHours();document.body.classList.toggle("night",h>=18||h<6)}}
automaticTheme();setInterval(automaticTheme,60000);
</script>
